name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Static musl binary: runs on any PVE version regardless of host glibc
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release --target $TARGET

      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/$TARGET/release/pve-pci-fixer dist/pve-pci-fixer
          strip dist/pve-pci-fixer
          cd dist && sha256sum pve-pci-fixer > pve-pci-fixer.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pve-pci-fixer-${{ env.TARGET }}
          path: dist/*

      # Tag pushes (e.g. v0.2.0) publish a GitHub Release. The asset is named
      # "pve-pci-fixer" so install.sh's releases/download/<tag>/pve-pci-fixer URL works.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pve-pci-fixer
            dist/pve-pci-fixer.sha256
          generate_release_notes: true
